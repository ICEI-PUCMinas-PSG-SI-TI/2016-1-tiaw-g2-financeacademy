<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <title>Finance Academy</title>
</head>
<body>
  <nav id="cabecalho" class="navbar bg-body-tertiary m-5 rounded-2">
    <div class="container d-flex">
      <a class="navbar-brand" href="#">
        <img src="imagens/Logo.png" alt="Financy Academy" width="115" height="100">
      </a>
    </div>
  </nav>
  <div id="formulario" class="container p-3 mb-2 text-white mt-5 main-um">
        <div class="row rounded-2">
            <div class="col-md-6 text-start font-monospace text-white p-5 texto-form">
                <h1>Aprenda a<br> economizar<br> seu dinheiro</h1>
                <p class="fs-4 mt-3">Ajudamos você a economizar independente da <br>sua renda</p>
                <button id="bTeste" type="button" class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#formModal">
        Iniciar Teste
      </button>

<div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content px-5 py-3">

      <form id="perguntas">
        <div class="mb-3">
          <h5>1. Qual é o seu nível de conhecimento em educação financeira?</h5>
          <div class="form-check">
  <input class="form-check-input" type="radio" name="nivel" id="radioNenhum" value="Nenhum" checked>
  <label class="form-check-label" for="radioNenhum"> Nenhum</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="nivel" id="radioBasico" value="Básico">
  <label class="form-check-label" for="radioBasico"> Básico</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="nivel" id="radioIntermediario" value="Intermediário">
  <label class="form-check-label" for="radioIntermediario"> Intermediário</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="nivel" id="radioAvancado" value="Avançado">
  <label class="form-check-label" for="radioAvancado"> Avançado</label>
</div>
  <h5>2. Qual é sua faixa etária?</h5>
  <div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="faixa" id="inlineRadio1" value="18-24">
  <label class="form-check-label" for="inlineRadio1">18-24</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="faixa" id="inlineRadio2" value="25-34">
  <label class="form-check-label" for="inlineRadio2">25-34</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="faixa" id="inlineRadio3" value="35-44">
  <label class="form-check-label" for="inlineRadio3">35-44</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="faixa" id="inlineRadio4" value="45+">
  <label class="form-check-label" for="inlineRadio4">45+</label>
</div>
  <h5>3. Quais são seus principais objetivos financeiros?</h5>
<div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" name="objetivos" id="checkInvestimentos" value="investimentos">
    <label class="form-check-label" for="checkInvestimentos">Investimentos</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" name="objetivos" id="checkPlanejamento" value="planejamento">
    <label class="form-check-label" for="checkPlanejamento">Planejamento</label>
  </div>
</div>
<div class="form-check">
  <input class="form-check-input" type="checkbox" name="objetivos" id="checkAposentadoria" value="aposentadoria">
  <label class="form-check-label" for="checkAposentadoria">Aposentadoria</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="checkbox" name="objetivos" id="checkDividas" value="dividas">
  <label class="form-check-label" for="checkDividas">Dívidas</label>
</div>
  <label for="salario" class="form-label ">4. Qual a sua média salarial?</label>
  <input type="text" class="form-control" id="salario" placeholder="00,00">
</div>
<div class="mb-3">
  <label for="comentario" class="form-label">5. Algum comentário adicional?</label>
  <input type="text" class="form-control" id="comentario" placeholder="...">
</div>
  <button type="submit" class="enviar" id="envio">Enviar</button>
</form>
</div>
  </div>
</div>
    </div>
      <div class="col-md-6 p-4 pe-5 text-center">
        <img src="imagens/imagen1.jpeg" alt="imagnem 1" class="img-fluid" width="345" height="500" >
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="scread.js"></script>
</body>
</html>
