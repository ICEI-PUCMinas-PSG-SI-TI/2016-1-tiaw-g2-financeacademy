<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Financeiro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        
        <div id="inicio">

            <h1> Quiz de Educação Financeira</h1>

            <p>
                Teste seus conhecimentos sobre
                finanças e investimentos.
            </p>

            <button id="btnIniciar">
                Iniciar Quiz
            </button>

        </div>

        <!-- Quiz -->
        <div id="quiz">

            <p id="contador"></p>

            <h2 id="pergunta"></h2>

            <div id="alternativas"></div>

            <button id="proxima">
                Próxima
            </button>

            <p id="resultado"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
